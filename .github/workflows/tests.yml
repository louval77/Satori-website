# Runs the automated Playwright checks. Start it by hand from the "Actions" tab,
# or it runs by itself on pull requests. It never blocks publishing.
name: Tests

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The live check of university websites depends on their servers, so it is skipped here.
      - run: npx playwright test --grep-invert "network check"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
